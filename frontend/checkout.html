<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Checkout | Sublimados App</title>

<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/checkout.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

<div class="logo">
<img src="assets/logo.png" alt="Logo">
</div>

<div class="nav-links">
    <a href="index.html">Inicio</a>
    <a href="products.html">Productos</a>
    <a href="cart.html">Carrito</a>
    <div id="user-section"></div>
</div>

</nav>


<!-- CONTENIDO -->

<section class="checkout-wrapper">

<h1>Finalizar compra</h1>

<div class="checkout-layout">

<!-- FORMULARIO -->

<form id="checkoutForm" class="checkout-form">

<h2>Datos de envío</h2>

<input type="text" id="address" placeholder="Dirección" required>
<input type="text" id="city" placeholder="Ciudad" required>
<input type="text" id="phone" placeholder="Teléfono" required>

<textarea id="notes" placeholder="Notas (opcional)"></textarea>

<button type="submit" class="checkout-btn">
Confirmar pedido
</button>

</form>


<!-- RESUMEN -->

<div class="checkout-summary">

<h2>Resumen</h2>

<div id="checkout-summary"></div>

</div>

</div>

</section>


<!-- FOOTER -->
<footer class="footer">
    <div class="footer-content">
        <p>© 2026 SublimApp</p>

        <div class="social-icons">
            <a href="https://instagram.com" target="_blank" class="instagram">
                <i class="fab fa-instagram"></i>
            </a>

            <a href="https://www.facebook.com/mjvc.zapotlanejo.5" target="_blank" class="facebook">
                <i class="fab fa-facebook-f"></i>
            </a>

            <a href="https://wa.me/523325101301" target="_blank" class="whatsapp">
                <i class="fab fa-whatsapp"></i>
            </a>
        </div>
    </div>
</footer>


<!-- SCRIPTS -->
<script src="js/navbar.js"></script>
<script src="js/checkout.js"></script>

</body>
</html>
