<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Productos | Sublimados App</title>

<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/products.css">
<link rel="stylesheet" href="css/chatbot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

<div class="logo">
    <img src="assets/logo.png" alt="Logo">
</div>

<div class="nav-links">
    <a href="index.html">Inicio</a>
    <a href="products.html">Productos</a>
    <a href="orders.html">Mis Pedidos</a>
    <a href="cart.html">Carrito</a>
    <div id="user-section"></div>
</div>

</nav>


<!-- HERO -->

<section class="products-hero">

<h1>Nuestros Productos</h1>
<p>Personaliza tazas, playeras y láminas con tus diseños</p>

</section>


<!-- PRODUCTOS -->

<section class="products-page">

<div id="products" class="products-grid"></div>

</section>


<!-- MODAL -->

<div id="customModal" class="modal">

    <div class="modal-content">

        <h2 class="modal-title">Personalizar producto</h2>

        <div id="product-options"></div>

        <div class="modal-field">
            <label for="modal-images">Sube tu diseño:</label>
            <input type="file" id="modal-images" multiple>
        </div>

        <div class="modal-buttons">
            <button id="cancelModalBtn" class="btn-cancel">
                Cancelar
            </button>

            <button id="confirmAddBtn" class="btn-primary">
                Agregar al carrito
            </button>
        </div>

    </div>

</div>

<!-- FOOTER -->
<footer class="footer">
    <div class="footer-content">
        <p>© 2026 SublimApp</p>

        <div class="social-icons">
            <a href="https://instagram.com" target="_blank" class="instagram">
                <i class="fab fa-instagram"></i>
            </a>

            <a href="https://www.facebook.com/mjvc.zapotlanejo.5" target="_blank" class="facebook">
                <i class="fab fa-facebook-f"></i>
            </a>

            <a href="https://wa.me/523325101301" target="_blank" class="whatsapp">
                <i class="fab fa-whatsapp"></i>
            </a>
        </div>
    </div>
</footer>

<!-- 💬 CHATBOT -->
<div id="chatbot-container">
    <div id="chatbot-header">
        <span>Asistente</span>
        <button id="close-chat">✖</button>
    </div>

    <div id="chatbot-messages"></div>

    <div id="chatbot-input">
        <input type="text" id="chat-input" placeholder="Escribe tu mensaje...">
        <button id="send-btn">➤</button>
    </div>
</div>

<button id="chatbot-toggle">💬</button>

<!-- SCRIPT -->
<script src="js/app.js"></script>
<script src="js/navbar.js"></script>
<script src="js/chatbot.js"></script>

</body>
</html>
