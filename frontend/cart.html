<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 🔥 CLAVE PARA RESPONSIVE -->

<title>Carrito | Sublimados App</title>

<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/cart.css">
<link rel="stylesheet" href="css/chatbot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

<div class="logo">
    <img src="assets/logo.png">
</div>

<div class="menu-toggle" id="menu-toggle">
    ☰
</div>

<div class="nav-links" id="nav-links">
    <a href="index.html">Inicio</a>
    <a href="products.html">Productos</a>
    <a href="orders.html">Mis Pedidos</a>
    <a href="cart.html">Carrito</a>
    <div id="user-section"></div>
</div>

</nav>


<!-- ========================= -->
<!-- 🛒 CARRITO -->
<!-- ========================= -->
<section class="cart-wrapper">

<h1>Tu carrito</h1>

<div class="cart-layout">

    <!-- PRODUCTOS -->
    <div id="cart-items" class="cart-items"></div>

    <!-- RESUMEN -->
    <div class="cart-summary">

        <h2>Resumen</h2>

        <div class="total-row">
            <span>Total</span>
            <span id="cart-total">$0</span>
        </div>

        <button id="checkoutBtn" class="checkout-btn">
            Finalizar compra
        </button>

    </div>

</div>

</section>


<!-- FOOTER -->
<footer class="footer">
    <div class="footer-content">
        <p>© 2026 SublimApp</p>

        <div class="social-icons">
            <a href="https://instagram.com" target="_blank">
                <i class="fab fa-instagram"></i>
            </a>

            <a href="https://www.facebook.com/mjvc.zapotlanejo.5" target="_blank">
                <i class="fab fa-facebook-f"></i>
            </a>

            <a href="https://wa.me/523325101301" target="_blank">
                <i class="fab fa-whatsapp"></i>
            </a>
        </div>
    </div>
</footer>


<!-- 💬 CHATBOT -->
<div id="chatbot-container">
    <div id="chatbot-header">
        <span>Asistente virtual</span>
    </div>

    <div id="chatbot-messages"></div>

    <div id="chatbot-input">
        <input type="text" id="chat-input" placeholder="Escribe tu mensaje...">
        <button id="send-btn">➤</button>
    </div>
</div>

<button id="chatbot-toggle">💬</button>


<!-- SCRIPTS -->
<script src="js/navbar.js"></script>
<script src="js/cart.js"></script>
<script src="js/chatbot.js"></script>

<script>
document.getElementById("checkoutBtn").onclick = () => {
    window.location.href = "checkout.html";
};
</script>

</body>
</html>
